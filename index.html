<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-input">
             <h2>To-Do List</h2><br>
             <div>
                <form class="form">
                <input id="todo-entry" type="text" placeholder="Write your To-do's here" autocomplete="off"><br>
                <textarea name="desc" id="description" placeholder="Task description"></textarea> 
                <p id="word-count"></p><br>
                     <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter the Password">
                        <span class="toggle-icon" onclick="togglePassword('password', this)">&#128065;</span>
                    </div><br>
                <input type="number" placeholder="Timer in Minutes" id="timer"><br>  
                <button id="add-button" onclick="addTask(event)">Add</button>
             </form>
             </div>
        
            <ul id="list-container">
                <!-- <li class="checked">Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li> -->
            </ul>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
